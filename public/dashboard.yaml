type: sections
max_columns: 4
title: Gym
path: gym
icon: mdi:dumbbell
visible:
  - user: 6bbad98d8a714df3a15e8f5eb58276d0
  - user: a05b2a91171b483f86354d025907efd8
sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:thermometer
        heading: Roof climate
        heading_style: subtitle
      - type: thermostat
        entity: climate.roof
        show_current_as_primary: true
        grid_options:
          columns: 8
          rows: 6
        features:
          - type: climate-hvac-modes
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(120deg,
                rgba(54, 64, 77, 0.92) 0%,
                rgba(18, 21, 25, 0.82) 100%) !important;
              border-radius: 10px !important;
              border: none !important;
              box-shadow:
                0 0 0 1px rgba(70, 115, 125, 0.12),
                0 0 14px 3px rgba(65, 115, 125, 0.20),
                0 4px 20px 0 rgba(0, 0, 0, 0.40),
                inset 0 1px 0 rgba(100, 160, 170, 0.07) !important;
              backdrop-filter: blur(4px) !important;
              transition: box-shadow 0.3s !important;
            }
            ha-card:hover {
              box-shadow:
                0 0 0 1px rgba(70, 115, 125, 0.16),
                0 0 20px 5px rgba(65, 115, 125, 0.26),
                0 8px 28px 0 rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(120, 180, 180, 0.10) !important;
            }
            .title {
              display: none;
            }
      - type: custom:ring-tile
        entity: sensor.alpstuga_air_quality_monitor_carbon_dioxide_4
        ring_size: 2
        indicator: dot
        name: CO2
        max: 1200
        colour:
          '0': ha_grey
          '1': ha_green
          '600': ha_green
          '800': ha_yellow
          '1000': ha_red
        top_element: unit
        middle_element: value
        bottom_element: name
        hide_state: true
        ring_only: true
        grid_options:
          columns: 1
        marker:
          entity: sensor.alpstuga_air_quality_monitor_carbon_dioxide_4
        card_mod:
          style: |
            ha-card {
              background-color: rgba(0,0,0,0.0) !important;
              border: none;
            }
      - type: custom:ring-tile
        entity: sensor.alpstuga_air_quality_monitor_pm2_5_4
        ring_size: 2
        indicator: dot
        ring_type: open
        ring_only: true
        name: PM 2.5
        max: 20
        colour:
          '0': ha_green
          '8': ha_green
          '11': ha_red
        top_element: unit
        middle_element: value
        bottom_element: name
        marker:
          entity: sensor.alpstuga_air_quality_monitor_pm2_5_4
        card_mod:
