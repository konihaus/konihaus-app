        entity: sensor.alpstuga_air_quality_monitor_air_quality_4
        ring_size: 2
        indicator: dot
        ring_type: open
        ring_only: true
        name: Humidity
        min: 0
        max: 100
        colour:
          '0': ha_red
          '10': ha_red
          '30': ha_yellow
          '50': ha_green
          '70': ha_blue
