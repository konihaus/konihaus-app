    name: Heatpump power
    entity:
      entity: sensor.wh_warmepumpe_warmeleistung
    ring_size: 2
    indicator: arc
    ring_only: true
    max: 25000
    colour:
      '10': ha_grey
      '5000': ha_blue
      '10000': ha_green
      '15000': ha_yellow
      '22000': ha_red
    top_element: icon
    middle_element: value_with_unit
    bottom_element: name
    scale: ticks
    ring_type: open
