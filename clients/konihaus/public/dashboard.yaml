- type: grid
  cards:
  - type: markdown
    title: 🚨 Open Windows (Armed)
    content: "    {% set standard_entities = {\n      'binary_sensor.bedroom_window': 'Bedroom Window',\n      'binary_sensor.dori_window': 'Dori Window',\n      'binary_sensor.zsofi_window': 'Zsofi Window',\n\
      \      'binary_sensor.timi_office_window': 'Timi Office Window',\n      'binary_sensor.bathroom_window': 'Bathroom Window',\n      'binary_sensor.kids_bathroom_window1': 'Kids Bathroom Window 1',\n\
      \      'binary_sensor.kids_bathroom_window2': 'Kids Bathroom Window 2',\n      'binary_sensor.dining_door': 'Dining Door',\n      'binary_sensor.living_room_teracce_door': 'Living Room Terrace Door',\n\
      \      'binary_sensor.door_sensor_roof_right_contact': 'Roof Right Door Contact',\n      'binary_sensor.kitchen_door': 'Kitchen Door',\n      'binary_sensor.door_sensor_roof_left_contact': 'Roof Left\
      \ Door Contact'\n    } %}\n    {% set lock_entities = {\n      'lock.qnodoor': 'Entry door',\n    } %}\n    {% set cover_entities = {\n      'cover.roof_back_1': 'Roof Back 1',\n      'cover.roof_back_2':\
      \ 'Roof Back 2',\n      'cover.roof_room_1': 'Roof Room 1',\n      'cover.roof_room_2': 'Roof Room 2'\n    } %}\n    {%- set ns = namespace(open=[]) -%}\n    {%- for entity_id, name in standard_entities.items()\
      \ -%}\n      {%- if is_state(entity_id, 'on') -%}\n        {%- set ns.open = ns.open + [name] -%}\n      {%- endif -%}\n    {%- endfor -%}\n    {%- for entity_id, name in lock_entities.items() -%}\n\
      \      {%- if is_state(entity_id, 'unlocked') -%}\n        {%- set ns.open = ns.open + [name] -%}\n      {%- endif -%}\n    {%- endfor -%}\n    {%- for entity_id, name in cover_entities.items() -%}\n\
      \      {%- if not is_state(entity_id, 'closed') -%}\n        {%- set ns.open = ns.open + [name] -%}\n      {%- endif -%}\n    {%- endfor -%}\n    {% if ns.open | length > 0 %}\n      **⚠️ {{ ns.open\
      \ | length }} item(s) open:**\n      {% for name in ns.open %}\n      - {{ name }}\n      {% endfor %}\n    {% else %}\n      ✅ All windows, doors, and covers closed\n    {% endif %}"
    visibility:
    - condition: state
      entity: input_boolean.armed
      state: 'on'
